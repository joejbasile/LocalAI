services:
  # --- THE LLM ENGINE ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped 
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # --- PERFORMANCE TUNING ---
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q6_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
  # --- MODEL PULLER ---
  ollama-pull-brain:
    image: ollama/ollama:latest
    container_name: ollama-pull-brain
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama..."
        sleep 5
        ollama pull ${MODEL_NAME}
        exit 0

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped

  # --- SEARCH ENGINE ---
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - SEARXNG_VALKEY_URL=redis://redis:6379/0
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # --- HERMES AGENT ---
  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: hermes-gateway
    environment:
      - INFERENCE_PROVIDER=custom
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - MODEL=${MODEL_NAME}
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=hermes_secret_123
      - GATEWAY_ALLOW_ALL_USERS=true
    volumes:
      - ./hermes-data:/root/.hermes
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull-brain:
        condition: service_completed_successfully

  orchestrator:
    build:
      context: ./orchestrator  # Path to the folder containing your app.py and Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - searxng
      - hermes-gateway

  # --- FRONTEND ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://orchestrator:5000
      - OPENAI_API_KEY=hermes_secret_123
      # Disable built-in search (Hermes will handle logic)
      - ENABLE_RAG_WEB_SEARCH=False
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
      hermes-gateway:
        condition: service_started

volumes:
  ollama_data:
  open-webui_data: